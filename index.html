<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restock App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide number input arrows for a cleaner mobile look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for dark theme textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #374151; 
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #4B5563; 
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center">

    <!-- Auth Screen -->
    <div id="authScreen" class="w-full max-w-md px-6 flex flex-col justify-center min-h-screen">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-xl border border-gray-700 text-center space-y-6">
            <div class="w-16 h-16 bg-gray-700 text-blue-400 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Secure Access</h1>
                <p class="text-gray-400 mt-2 text-sm">Enter passcode to view inventory</p>
            </div>
            
            <div class="space-y-4 pt-4">
                <input type="password" id="passcodeInput" placeholder="Enter code" 
                    class="w-full text-center text-xl font-bold p-4 bg-gray-900 border border-gray-600 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                
                <div id="authError" class="hidden text-red-400 text-sm font-medium">Incorrect passcode. Try again.</div>
                
                <button onclick="checkPasscode()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-lg font-semibold py-4 rounded-2xl shadow-md transition-all active:scale-[0.98]">
                    Unlock App
                </button>
            </div>
        </div>
    </div>

    <!-- Main App (Hidden initially) -->
    <div id="mainApp" class="hidden w-full max-w-md px-4 pb-10 fade-in">
        
        <header class="py-6 mb-2 sticky top-0 bg-gray-900 z-10 border-b border-gray-800">
            <h1 class="text-2xl font-bold text-white tracking-tight">Current Stock Check</h1>
            <p class="text-gray-400 text-sm mt-1">Enter amounts currently present.</p>
        </header>

        <main class="space-y-6 mt-4">
            
            <!-- Items Container (Populated by JS) -->
            <div id="itemsContainer" class="space-y-4">
                <!-- Inputs inject here -->
            </div>

            <!-- Action Button -->
            <button onclick="generateRestockList()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition-all active:scale-[0.98]">
                <i class="fa-solid fa-list-check mr-2"></i> Generate List
            </button>

            <!-- Result Section -->
            <div id="resultArea" class="hidden bg-gray-800 p-6 rounded-3xl shadow-xl border border-gray-700 space-y-5 fade-in">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest text-center">Required Items</h2>
                
                <textarea id="outputText" readonly rows="5" 
                    class="w-full p-4 bg-gray-900 border border-gray-600 rounded-2xl text-white font-mono text-base font-medium focus:outline-none resize-none"></textarea>
                
                <button onclick="copyToClipboard()" id="copyBtn" class="w-full flex items-center justify-center gap-3 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white text-xl font-bold py-5 rounded-2xl shadow-md transition-all active:scale-[0.98]">
                    <i class="fa-regular fa-copy text-xl"></i>
                    <span id="copyBtnText">Copy to Clipboard</span>
                </button>
            </div>

        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-4 rounded-full shadow-2xl text-sm font-bold opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Copied successfully!</span>
    </div>

    <script>
        // 1. Backend Expected Targets with Icons
        const INVENTORY_DATA = [
            { name: "Milk", target: 3, icon: "fa-solid fa-bottle-droplet", color: "text-blue-400" },
            { name: "Curd", target: 8, icon: "fa-solid fa-bowl-rice", color: "text-white" },
            { name: "Bread", target: 2, icon: "fa-solid fa-bread-slice", color: "text-amber-600" },
            { name: "Eggs", target: 12, icon: "fa-solid fa-egg", color: "text-orange-200" },
            { name: "Apples", target: 6, icon: "fa-solid fa-apple-whole", color: "text-red-400" },
            { name: "Soap", target: 4, icon: "fa-solid fa-pump-soap", color: "text-pink-400" }
        ];

        // 2. Auth Logic
        function checkPasscode() {
            const input = document.getElementById('passcodeInput').value;
            const errorMsg = document.getElementById('authError');
            
            if (input === 'haveli157') {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                renderItems();
            } else {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 3000);
            }
        }

        // Allow pressing 'Enter' on keyboard to submit passcode
        document.getElementById('passcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPasscode();
        });

        // 3. Render Inputs dynamically
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = ''; 

            INVENTORY_DATA.forEach((item, index) => {
                const safeId = `item_${index}`; 
                
                const itemHTML = `
                <div class="bg-gray-800 p-5 rounded-3xl shadow-sm border border-gray-700 flex items-center justify-between gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-gray-900 flex items-center justify-center border border-gray-700 flex-shrink-0">
                        <i class="${item.icon} ${item.color} text-xl"></i>
                    </div>
                    <div class="flex-grow">
                        <label for="${safeId}" class="block text-xl font-bold text-white">${item.name}</label>
                    </div>
                    <input type="number" id="${safeId}" min="0" inputmode="numeric" 
                        class="w-24 text-center text-2xl font-bold p-3 bg-gray-900 border border-gray-600 rounded-2xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>
                `;
                container.innerHTML += itemHTML;
            });
        }

        // 4. Calculate and Generate List
        function generateRestockList() {
            let compiledList = '';

            INVENTORY_DATA.forEach((item, index) => {
                const safeId = `item_${index}`;
                const inputElement = document.getElementById(safeId);
                
                // Skip if user forgets to enter a value
                if (inputElement.value.trim() === '') {
                    return; 
                }
                
                const currentStock = parseInt(inputElement.value);
                
                // Calculate required amount
                let amountNeeded = item.target - currentStock;

                // DATA VALIDATION: Clamp to 0 if they enter more than target
                if (amountNeeded < 0) {
                    amountNeeded = 0;
                }

                // Only add to list if we need to restock (Required > 0)
                if (amountNeeded > 0) {
                    compiledList += `${item.name}: ${amountNeeded}\n`;
                }
            });

            if (compiledList.trim() === '') {
                compiledList = 'Everything is fully stocked!';
            }

            // Display result
            const outputText = document.getElementById('outputText');
            outputText.value = compiledList.trim();
            
            const resultArea = document.getElementById('resultArea');
            resultArea.classList.remove('hidden');
            
            // Auto scroll down to results
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
            
            resetCopyButton();
        }

        // 5. Copy to Clipboard Utility
        async function copyToClipboard() {
            const textToCopy = document.getElementById('outputText').value;
            
            if (!textToCopy || textToCopy === 'Everything is fully stocked!') {
                showToast('Nothing to buy!');
                return;
            }

            // Fallback function for iframes or older browsers
            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('List copied to clipboard!');
                    setButtonCopiedState();
                } catch (err) {
                    console.error('Fallback copy failed: ', err);
                    showToast('Failed to copy. Select manually.');
                }
                document.body.removeChild(textArea);
            };

            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast('List copied to clipboard!');
                    setButtonCopiedState();
                } catch (err) {
                    console.warn('Clipboard API blocked or failed. Using fallback...', err);
                    fallbackCopy(textToCopy);
                }
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMsg');
            msgSpan.textContent = message;
            
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function setButtonCopiedState() {
            const btnText = document.getElementById('copyBtnText');
            const btn = document.getElementById('copyBtn');
            const icon = btn.querySelector('i');
            
            btnText.textContent = 'Copied!';
            icon.className = 'fa-solid fa-check text-xl';
            btn.classList.replace('bg-gray-700', 'bg-green-600');
            btn.classList.replace('hover:bg-gray-600', 'hover:bg-green-700');
            btn.classList.replace('active:bg-gray-500', 'active:bg-green-800');
            
            setTimeout(resetCopyButton, 3000);
        }

        function resetCopyButton() {
            const btnText = document.getElementById('copyBtnText');
            const btn = document.getElementById('copyBtn');
            const icon = btn.querySelector('i');
            
            btnText.textContent = 'Copy to Clipboard';
            icon.className = 'fa-regular fa-copy text-xl';
            btn.classList.replace('bg-green-600', 'bg-gray-700');
            btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-600');
            btn.classList.replace('active:bg-green-800', 'active:bg-gray-500');
        }
    </script>
</body>
</html>
